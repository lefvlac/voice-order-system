<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Staff Dashboard | Voice Order System</title>

    <style>
      :root {
        --background: #f4f6f8;
        --surface: #ffffff;
        --primary: #1f2937;
        --secondary: #4b5563;
        --border: #dfe3e8;
        --success: #15803d;
        --success-light: #dcfce7;
        --warning: #b45309;
        --warning-light: #fef3c7;
        --danger: #b91c1c;
        --danger-light: #fee2e2;
        --info: #1d4ed8;
        --info-light: #dbeafe;
        --shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;

        background: var(--background);
        color: var(--primary);
        min-height: 100vh;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .topbar {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 18px 28px;

        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;

        position: sticky;
        top: 0;
        z-index: 10;
      }

      .brand h1 {
        font-size: 22px;
        margin-bottom: 4px;
      }

      .brand p {
        color: var(--secondary);
        font-size: 14px;
      }

      .server-status {
        display: flex;
        align-items: center;
        gap: 8px;

        background: var(--success-light);
        color: var(--success);

        padding: 9px 13px;
        border-radius: 999px;

        font-size: 14px;
        font-weight: bold;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--success);
      }

      .status-dot.offline {
        background: var(--danger);
      }

      .container {
        width: min(1400px, calc(100% - 32px));
        margin: 28px auto 50px;
      }

      .toolbar {
        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 18px;

        display: flex;
        justify-content: space-between;
        align-items: end;
        flex-wrap: wrap;
        gap: 16px;

        margin-bottom: 22px;
      }

      .toolbar-group {
        display: flex;
        align-items: end;
        flex-wrap: wrap;
        gap: 12px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field label {
        font-size: 13px;
        color: var(--secondary);
        font-weight: bold;
      }

      .field input,
      .field select,
      .field textarea {
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 10px 12px;
        background: #ffffff;
        min-width: 150px;
      }

      .field textarea {
        resize: vertical;
        min-height: 90px;
      }

      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        outline: 2px solid rgba(29, 78, 216, 0.18);
        border-color: var(--info);
      }

      .button {
        border: none;
        border-radius: 9px;
        padding: 10px 14px;
        font-weight: bold;
        transition:
          transform 0.15s,
          opacity 0.15s;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
        transform: none;
      }

      .button-primary {
        background: var(--info);
        color: #ffffff;
      }

      .button-success {
        background: var(--success);
        color: #ffffff;
      }

      .button-warning {
        background: var(--warning);
        color: #ffffff;
      }

      .button-danger {
        background: var(--danger);
        color: #ffffff;
      }

      .button-neutral {
        background: #e5e7eb;
        color: var(--primary);
      }

      .statistics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));

        gap: 16px;
        margin-bottom: 22px;
      }

      .stat-card {
        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 20px;
      }

      .stat-title {
        color: var(--secondary);
        font-size: 13px;
        margin-bottom: 8px;
      }

      .stat-value {
        font-size: 28px;
        font-weight: bold;
      }

      .orders-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;

        margin-bottom: 14px;
      }

      .orders-header h2 {
        font-size: 20px;
      }

      .last-update {
        font-size: 13px;
        color: var(--secondary);
      }

      .orders-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));

        gap: 18px;
      }

      .order-card {
        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
        border: 1px solid transparent;
      }

      .order-card.ready {
        border-color: #86efac;
      }

      .order-card.rejected {
        border-color: #fca5a5;
      }

      .order-card-header {
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);

        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 12px;
      }

      .order-number {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 4px;
      }

      .order-time {
        color: var(--secondary);
        font-size: 13px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        padding: 6px 10px;
        border-radius: 999px;

        font-size: 12px;
        font-weight: bold;
        white-space: nowrap;
      }

      .badge-pending {
        background: var(--warning-light);
        color: var(--warning);
      }

      .badge-ready {
        background: var(--success-light);
        color: var(--success);
      }

      .badge-rejected {
        background: var(--danger-light);
        color: var(--danger);
      }

      .badge-info {
        background: var(--info-light);
        color: var(--info);
      }

      .order-body {
        padding: 18px;
      }

      .order-meta {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));

        gap: 10px;
        margin-bottom: 16px;
      }

      .meta-item {
        background: #f8fafc;
        border-radius: 9px;
        padding: 10px;
      }

      .meta-label {
        color: var(--secondary);
        font-size: 11px;
        margin-bottom: 4px;
        text-transform: uppercase;
      }

      .meta-value {
        font-size: 14px;
        overflow-wrap: anywhere;
      }

      .items-title {
        font-size: 14px;
        margin-bottom: 10px;
      }

      .items-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      .order-item {
        background: #f8fafc;
        border-left: 4px solid var(--info);
        border-radius: 8px;
        padding: 10px 12px;
      }

      .item-main {
        font-weight: bold;
        margin-bottom: 5px;
      }

      .item-details {
        color: var(--secondary);
        font-size: 13px;
        line-height: 1.5;
      }

      .raw-text {
        margin-top: 15px;
        border-top: 1px solid var(--border);
        padding-top: 13px;
      }

      .raw-text summary {
        color: var(--secondary);
        cursor: pointer;
        font-size: 13px;
        font-weight: bold;
      }

      .raw-text p {
        margin-top: 10px;
        line-height: 1.5;
        font-size: 13px;
      }

      .order-actions {
        border-top: 1px solid var(--border);
        padding: 14px 18px;

        display: flex;
        flex-wrap: wrap;
        gap: 9px;
      }

      .empty-state,
      .loading-state,
      .error-state {
        grid-column: 1 / -1;

        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow);

        text-align: center;
        padding: 50px 20px;
      }

      .empty-state h3,
      .loading-state h3,
      .error-state h3 {
        margin-bottom: 10px;
      }

      .empty-state p,
      .loading-state p,
      .error-state p {
        color: var(--secondary);
      }

      .error-state {
        border: 1px solid #fca5a5;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.58);

        display: none;
        justify-content: center;
        align-items: center;

        padding: 20px;
        z-index: 100;
      }

      .modal-overlay.visible {
        display: flex;
      }

      .modal {
        width: min(650px, 100%);
        max-height: 92vh;
        overflow-y: auto;

        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .modal-header {
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);

        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
      }

      .modal-header h2 {
        font-size: 19px;
      }

      .modal-close {
        border: none;
        background: transparent;
        font-size: 25px;
        color: var(--secondary);
      }

      .modal-body {
        padding: 20px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));

        gap: 14px;
      }

      .form-grid .full-width {
        grid-column: 1 / -1;
      }

      .items-editor {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .editable-item {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 13px;
        background: #f8fafc;
      }

      .editable-item-grid {
        display: grid;
        grid-template-columns: 2fr 0.7fr 1fr;

        gap: 10px;
      }

      .editable-item-extras {
        margin-top: 10px;
      }

      .modal-actions {
        border-top: 1px solid var(--border);
        padding: 16px 20px;

        display: flex;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 10px;
      }

      .toast-container {
        position: fixed;
        top: 84px;
        right: 20px;
        z-index: 200;

        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .toast {
        min-width: 280px;
        max-width: 420px;

        padding: 13px 15px;
        border-radius: 10px;
        box-shadow: var(--shadow);

        background: var(--surface);
        border-left: 5px solid var(--info);

        animation: slide-in 0.2s ease;
      }

      .toast.success {
        border-left-color: var(--success);
      }

      .toast.error {
        border-left-color: var(--danger);
      }

      @keyframes slide-in {
        from {
          opacity: 0;
          transform: translateX(20px);
        }

        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @media (max-width: 900px) {
        .statistics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 650px) {
        .topbar {
          align-items: flex-start;
          padding: 16px;
        }

        .container {
          width: min(100% - 20px, 1400px);
          margin-top: 15px;
        }

        .toolbar {
          align-items: stretch;
        }

        .toolbar-group {
          width: 100%;
          align-items: stretch;
          flex-direction: column;
        }

        .field input,
        .field select {
          width: 100%;
        }

        .statistics {
          grid-template-columns: 1fr 1fr;
        }

        .orders-grid {
          grid-template-columns: 1fr;
        }

        .form-grid,
        .editable-item-grid {
          grid-template-columns: 1fr;
        }

        .form-grid .full-width {
          grid-column: auto;
        }

        .order-meta {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <header class="topbar">
      <div class="brand">
        <h1>Voice Order System</h1>
        <p>Πίνακας διαχείρισης τηλεφωνικών παραγγελιών</p>
      </div>

      <div id="serverStatus" class="server-status">
        <span id="statusDot" class="status-dot"></span>

        <span id="statusText"> Έλεγχος σύνδεσης... </span>
      </div>
    </header>

    <main class="container">
      <section class="toolbar">
        <div class="toolbar-group">
          <div class="field">
            <label for="storeFilter"> Κατάστημα </label>

            <select id="storeFilter">
              <option value="">Όλα τα καταστήματα</option>

              <option value="1">Κατάστημα 1</option>

              <option value="2">Κατάστημα 2</option>
            </select>
          </div>

          <div class="field">
            <label for="statusFilter"> Κατάσταση </label>

            <select id="statusFilter">
              <option value="">Όλες</option>

              <option value="PENDING">Σε αναμονή</option>

              <option value="READY">Έτοιμες</option>

              <option value="REJECTED">Απορριφθείσες</option>
            </select>
          </div>

          <div class="field">
            <label for="searchInput"> Αναζήτηση </label>

            <input
              id="searchInput"
              type="search"
              placeholder="Τηλέφωνο, προϊόν..."
            />
          </div>
        </div>

        <div class="toolbar-group">
          <label>
            <input id="autoRefresh" type="checkbox" checked />

            Αυτόματη ανανέωση
          </label>

          <button
            id="refreshButton"
            class="button button-primary"
            type="button"
          >
            Ανανέωση
          </button>
        </div>
      </section>

      <section class="statistics">
        <article class="stat-card">
          <div class="stat-title">Σύνολο παραγγελιών</div>

          <div id="totalOrders" class="stat-value">0</div>
        </article>

        <article class="stat-card">
          <div class="stat-title">Σε αναμονή</div>

          <div id="pendingOrders" class="stat-value">0</div>
        </article>

        <article class="stat-card">
          <div class="stat-title">Έτοιμες</div>

          <div id="readyOrders" class="stat-value">0</div>
        </article>

        <article class="stat-card">
          <div class="stat-title">Σύνολο προϊόντων</div>

          <div id="totalItems" class="stat-value">0</div>
        </article>
      </section>

      <section>
        <div class="orders-header">
          <h2>Παραγγελίες</h2>

          <div id="lastUpdate" class="last-update">
            Δεν έχει πραγματοποιηθεί ανανέωση.
          </div>
        </div>

        <div id="ordersGrid" class="orders-grid">
          <div class="loading-state">
            <h3>Φόρτωση παραγγελιών...</h3>
            <p>Παρακαλώ περιμένετε.</p>
          </div>
        </div>
      </section>
    </main>

    <div
      id="editModal"
      class="modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="editModalTitle"
    >
      <div class="modal">
        <div class="modal-header">
          <h2 id="editModalTitle">Επεξεργασία παραγγελίας</h2>

          <button
            id="closeModalButton"
            class="modal-close"
            type="button"
            aria-label="Κλείσιμο"
          >
            &times;
          </button>
        </div>

        <form id="editOrderForm">
          <div class="modal-body">
            <input id="editOrderId" type="hidden" />

            <div class="form-grid">
              <div class="field">
                <label for="editOrderType"> Τύπος παραγγελίας </label>

                <select id="editOrderType">
                  <option value="TAKE AWAY">TAKE AWAY</option>

                  <option value="DELIVERY">DELIVERY</option>
                </select>
              </div>

              <div class="field">
                <label for="editPhone"> Τηλέφωνο </label>

                <input id="editPhone" type="text" />
              </div>

              <div class="field full-width">
                <label for="editAddress"> Διεύθυνση </label>

                <input id="editAddress" type="text" />
              </div>

              <div class="field full-width">
                <label> Προϊόντα </label>

                <div id="itemsEditor" class="items-editor"></div>
              </div>
            </div>
          </div>

          <div class="modal-actions">
            <button
              id="addItemButton"
              class="button button-neutral"
              type="button"
            >
              Προσθήκη προϊόντος
            </button>

            <button
              class="button button-neutral"
              type="button"
              data-close-modal
            >
              Ακύρωση
            </button>

            <button class="button button-primary" type="submit">
              Αποθήκευση
            </button>
          </div>
        </form>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script>
      const state = {
        orders: [],
        refreshIntervalId: null,
        refreshEveryMilliseconds: 5000,
      };

      const elements = {
        ordersGrid: document.getElementById("ordersGrid"),
        storeFilter: document.getElementById("storeFilter"),
        statusFilter: document.getElementById("statusFilter"),
        searchInput: document.getElementById("searchInput"),
        refreshButton: document.getElementById("refreshButton"),
        autoRefresh: document.getElementById("autoRefresh"),
        lastUpdate: document.getElementById("lastUpdate"),

        totalOrders: document.getElementById("totalOrders"),
        pendingOrders: document.getElementById("pendingOrders"),
        readyOrders: document.getElementById("readyOrders"),
        totalItems: document.getElementById("totalItems"),

        serverStatus: document.getElementById("serverStatus"),
        statusDot: document.getElementById("statusDot"),
        statusText: document.getElementById("statusText"),

        editModal: document.getElementById("editModal"),
        editOrderForm: document.getElementById("editOrderForm"),
        editOrderId: document.getElementById("editOrderId"),
        editOrderType: document.getElementById("editOrderType"),
        editPhone: document.getElementById("editPhone"),
        editAddress: document.getElementById("editAddress"),
        itemsEditor: document.getElementById("itemsEditor"),
        addItemButton: document.getElementById("addItemButton"),
        closeModalButton: document.getElementById("closeModalButton"),

        toastContainer: document.getElementById("toastContainer"),
      };

      function escapeHtml(value) {
        const div = document.createElement("div");

        div.textContent = value ?? "";

        return div.innerHTML;
      }

      function parseItems(items) {
        if (Array.isArray(items)) {
          return items;
        }

        if (typeof items === "string") {
          try {
            const parsedItems = JSON.parse(items);

            return Array.isArray(parsedItems) ? parsedItems : [];
          } catch (error) {
            console.error("Αποτυχία μετατροπής items_json:", error);

            return [];
          }
        }

        return [];
      }

      function getOrderId(order) {
        return order.id ?? order.order_id;
      }

      function getOrderStatus(order) {
        return String(order.status ?? "PENDING").toUpperCase();
      }

      function formatDate(dateValue) {
        if (!dateValue) {
          return "Άγνωστη ώρα";
        }

        const normalizedValue = String(dateValue).includes("T")
          ? dateValue
          : String(dateValue).replace(" ", "T");

        const date = new Date(normalizedValue);

        if (Number.isNaN(date.getTime())) {
          return String(dateValue);
        }

        return date.toLocaleString("el-GR", {
          dateStyle: "short",
          timeStyle: "short",
        });
      }

      function showToast(message, type = "info") {
        const toast = document.createElement("div");

        toast.className = `toast ${type}`;
        toast.textContent = message;

        elements.toastContainer.appendChild(toast);

        window.setTimeout(() => toast.remove(), 3500);
      }

      function setServerStatus(isOnline) {
        if (isOnline) {
          elements.statusText.textContent = "Server online";
          elements.statusDot.classList.remove("offline");
          elements.serverStatus.style.background = "#dcfce7";
          elements.serverStatus.style.color = "#15803d";
        } else {
          elements.statusText.textContent = "Server offline";
          elements.statusDot.classList.add("offline");
          elements.serverStatus.style.background = "#fee2e2";
          elements.serverStatus.style.color = "#b91c1c";
        }
      }

      async function checkHealth() {
        try {
          const response = await fetch("/health", {
            cache: "no-store",
          });

          setServerStatus(response.ok);
        } catch (error) {
          setServerStatus(false);
        }
      }

      async function fetchOrders({ showLoading = false } = {}) {
        const storeId = elements.storeFilter.value;

        const url = storeId
          ? `/api/orders?store_id=${encodeURIComponent(storeId)}`
          : "/api/orders";

        if (showLoading) {
          elements.ordersGrid.innerHTML = `
                <div class="loading-state">
                    <h3>Φόρτωση παραγγελιών...</h3>
                    <p>Παρακαλώ περιμένετε.</p>
                </div>
            `;
        }

        elements.refreshButton.disabled = true;

        try {
          const response = await fetch(url, {
            cache: "no-store",
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();

          state.orders = Array.isArray(data) ? data : (data.orders ?? []);

          renderOrders();

          elements.lastUpdate.textContent = `Τελευταία ανανέωση: ${new Date().toLocaleTimeString(
            "el-GR",
          )}`;

          setServerStatus(true);
        } catch (error) {
          console.error(error);

          elements.ordersGrid.innerHTML = `
                <div class="error-state">
                    <h3>Αποτυχία σύνδεσης με το backend</h3>
                    <p>
                        Έλεγξε ότι ο FastAPI server λειτουργεί
                        στη διεύθυνση 127.0.0.1:8000.
                    </p>
                </div>
            `;

          setServerStatus(false);
        } finally {
          elements.refreshButton.disabled = false;
        }
      }

      function getFilteredOrders() {
        const selectedStatus = elements.statusFilter.value.toUpperCase();

        const searchTerm = elements.searchInput.value
          .trim()
          .toLocaleLowerCase("el");

        return state.orders.filter((order) => {
          const statusMatches =
            !selectedStatus || getOrderStatus(order) === selectedStatus;

          if (!statusMatches) {
            return false;
          }

          if (!searchTerm) {
            return true;
          }

          const items = parseItems(order.items ?? order.items_json);

          const searchableText = [
            order.phone,
            order.address,
            order.raw_text,
            order.normalized_text,
            order.order_type,
            order.store_id,
            ...items.map((item) => {
              const options = Array.isArray(item.options)
                ? item.options.join(" ")
                : (item.options ?? item.sugar ?? "");

              const extras = Array.isArray(item.extras)
                ? item.extras.join(" ")
                : (item.extras ?? "");

              return [
                item.product,
                item.name,
                options,
                extras,
              ].join(" ");
            }),
          ]
            .filter(Boolean)
            .join(" ")
            .toLocaleLowerCase("el");

          return searchableText.includes(searchTerm);
        });
      }

      function renderOrders() {
        const filteredOrders = getFilteredOrders();

        updateStatistics(filteredOrders);

        if (filteredOrders.length === 0) {
          elements.ordersGrid.innerHTML = `
                <div class="empty-state">
                    <h3>Δεν βρέθηκαν παραγγελίες</h3>
                    <p>
                        Δεν υπάρχουν παραγγελίες που να
                        αντιστοιχούν στα επιλεγμένα φίλτρα.
                    </p>
                </div>
            `;

          return;
        }

        elements.ordersGrid.innerHTML = filteredOrders
          .map(createOrderCard)
          .join("");
      }

      function updateStatistics(orders) {
        let totalItems = 0;
        let pending = 0;
        let ready = 0;

        for (const order of orders) {
          const status = getOrderStatus(order);

          if (status === "READY") {
            ready += 1;
          } else if (status !== "REJECTED") {
            pending += 1;
          }

          const items = parseItems(order.items ?? order.items_json);

          for (const item of items) {
            const quantity = Number(item.qty ?? item.quantity ?? 1);

            totalItems += Number.isFinite(quantity) ? quantity : 1;
          }
        }

        elements.totalOrders.textContent = orders.length;
        elements.pendingOrders.textContent = pending;
        elements.readyOrders.textContent = ready;
        elements.totalItems.textContent = totalItems;
      }

      function createOrderCard(order) {
        const orderId = getOrderId(order);
        const status = getOrderStatus(order);

        const items = parseItems(order.items ?? order.items_json);

        const statusData = getStatusData(status);

        const orderType = order.order_type ?? "TAKE AWAY";

        const itemsHtml = items.length
          ? items.map(createItemHtml).join("")
          : `
                <li class="order-item">
                    Δεν υπάρχουν καταχωρημένα προϊόντα.
                </li>
            `;

        const readyButton =
          status !== "READY"
            ? `
                <button
                    class="button button-success"
                    type="button"
                    onclick="markOrderReady(${Number(orderId)})"
                >
                    Έτοιμη
                </button>
            `
            : "";

        return `
            <article
                class="order-card ${statusData.cardClass}"
            >
                <div class="order-card-header">

                    <div>
                        <div class="order-number">
                            Παραγγελία #${escapeHtml(orderId)}
                        </div>

                        <div class="order-time">
                            ${escapeHtml(
                              formatDate(
                                order.created_at ??
                                  order.created ??
                                  order.timestamp,
                              ),
                            )}
                        </div>
                    </div>

                    <span class="badge ${statusData.badgeClass}">
                        ${statusData.label}
                    </span>
                </div>

                <div class="order-body">

                    <div class="order-meta">

                        <div class="meta-item">
                            <div class="meta-label">
                                Κατάστημα
                            </div>

                            <div class="meta-value">
                                ${escapeHtml(
                                  order.store_name ?? order.store_id ?? "-",
                                )}
                            </div>
                        </div>

                        <div class="meta-item">
                            <div class="meta-label">
                                Τύπος
                            </div>

                            <div class="meta-value">
                                <span class="badge badge-info">
                                    ${escapeHtml(orderType)}
                                </span>
                            </div>
                        </div>

                        <div class="meta-item">
                            <div class="meta-label">
                                Τηλέφωνο
                            </div>

                            <div class="meta-value">
                                ${escapeHtml(order.phone ?? "-")}
                            </div>
                        </div>

                        <div class="meta-item">
                            <div class="meta-label">
                                Διεύθυνση
                            </div>

                            <div class="meta-value">
                                ${escapeHtml(order.address || "-")}
                            </div>
                        </div>

                    </div>

                    <h3 class="items-title">
                        Προϊόντα
                    </h3>

                    <ul class="items-list">
                        ${itemsHtml}
                    </ul>

                    ${
                      order.raw_text
                        ? `
                            <details class="raw-text">
                                <summary>
                                    Αρχική απομαγνητοφώνηση
                                </summary>

                                <p>
                                    ${escapeHtml(order.raw_text)}
                                </p>
                            </details>
                        `
                        : ""
                    }

                </div>

                <div class="order-actions">

                    ${readyButton}

                    <button
                        class="button button-warning"
                        type="button"
                        onclick="openEditModal(${Number(orderId)})"
                    >
                        Επεξεργασία
                    </button>

                    <button
                        class="button button-danger"
                        type="button"
                        onclick="deleteOrder(${Number(orderId)})"
                    >
                        Διαγραφή
                    </button>

                </div>
            </article>
        `;
      }

      function createItemHtml(item) {
        const product = item.product ?? item.name ?? "Άγνωστο προϊόν";

        const quantity = item.qty ?? item.quantity ?? 1;

        const details = [];

        const options = Array.isArray(item.options)
          ? item.options
          : item.options
            ? [item.options]
            : item.sugar
              ? [item.sugar]
              : [];

        const extras = Array.isArray(item.extras)
          ? item.extras
          : item.extras
            ? [item.extras]
            : [];

        if (options.length) {
          details.push(
            `Επιλογές: ${options.map(escapeHtml).join(", ")}`
          );
        }

        if (extras.length) {
          details.push(
            `Extras: ${extras.map(escapeHtml).join(", ")}`
          );
        }

        return `
            <li class="order-item">
                <div class="item-main">
                    ${escapeHtml(quantity)} ×
                    ${escapeHtml(product)}
                </div>

                ${
                  details.length
                    ? `
                        <div class="item-details">
                            ${details.join("<br>")}
                        </div>
                    `
                    : ""
                }
            </li>
        `;
      }

      function getStatusData(status) {
        if (status === "READY") {
          return {
            label: "ΕΤΟΙΜΗ",
            badgeClass: "badge-ready",
            cardClass: "ready",
          };
        }

        if (status === "REJECTED") {
          return {
            label: "ΑΠΟΡΡΙΦΘΗΚΕ",
            badgeClass: "badge-rejected",
            cardClass: "rejected",
          };
        }

        return {
          label: "ΣΕ ΑΝΑΜΟΝΗ",
          badgeClass: "badge-pending",
          cardClass: "",
        };
      }

      async function markOrderReady(orderId) {
        const confirmed = window.confirm(
          `Να χαρακτηριστεί η παραγγελία #${orderId} ως έτοιμη;`,
        );

        if (!confirmed) {
          return;
        }

        try {
          const response = await fetch(`/api/orders/${orderId}/ready`, {
            method: "PATCH",
          });

          const data = await safeReadJson(response);

          if (!response.ok) {
            throw new Error(data.detail ?? "Αποτυχία ενημέρωσης.");
          }

          showToast("Η παραγγελία χαρακτηρίστηκε ως έτοιμη.", "success");

          await fetchOrders();
        } catch (error) {
          showToast(error.message, "error");
        }
      }

      async function deleteOrder(orderId) {
        const confirmed = window.confirm(
          `Να διαγραφεί οριστικά η παραγγελία #${orderId};`,
        );

        if (!confirmed) {
          return;
        }

        try {
          const response = await fetch(`/api/orders/${orderId}`, {
            method: "DELETE",
          });

          const data = await safeReadJson(response);

          if (!response.ok) {
            throw new Error(data.detail ?? "Αποτυχία διαγραφής.");
          }

          showToast("Η παραγγελία διαγράφηκε.", "success");

          await fetchOrders();
        } catch (error) {
          showToast(error.message, "error");
        }
      }

      function openEditModal(orderId) {
        const order = state.orders.find(
          (currentOrder) =>
            Number(getOrderId(currentOrder)) === Number(orderId),
        );

        if (!order) {
          showToast("Η παραγγελία δεν βρέθηκε.", "error");

          return;
        }

        const items = parseItems(order.items ?? order.items_json);

        elements.editOrderId.value = orderId;

        elements.editOrderType.value = order.order_type ?? "TAKE AWAY";

        elements.editPhone.value = order.phone ?? "";

        elements.editAddress.value = order.address ?? "";

        elements.itemsEditor.innerHTML = "";

        if (items.length === 0) {
          addEditableItem();
        } else {
          items.forEach(addEditableItem);
        }

        elements.editModal.classList.add("visible");
      }

      function closeEditModal() {
        elements.editModal.classList.remove("visible");
        elements.editOrderForm.reset();
        elements.itemsEditor.innerHTML = "";
      }

      function addEditableItem(item = {}) {
        const wrapper = document.createElement("div");

        wrapper.className = "editable-item";

        wrapper.innerHTML = `
            <div class="editable-item-grid">

                <div class="field">
                    <label>Προϊόν</label>

                    <input
                        class="edit-item-product"
                        type="text"
                        value="${escapeHtml(item.product ?? item.name ?? "")}"
                        required
                    >
                </div>

                <div class="field">
                    <label>Ποσότητα</label>

                    <input
                        class="edit-item-qty"
                        type="number"
                        min="1"
                        value="${escapeHtml(item.qty ?? item.quantity ?? 1)}"
                        required
                    >
                </div>

                <div class="field">
                    <label>Επιλογές</label>

                    <input
                        class="edit-item-options"
                        type="text"
                        value="${escapeHtml(
                          Array.isArray(item.options)
                            ? item.options.join(", ")
                            : item.options ?? item.sugar ?? ""
                        )}"
                    >
                </div>

            </div>

            <div class="field editable-item-extras">
                <label>Πρόσθετες επιλογές</label>

                <input
                    class="edit-item-extras-input"
                    type="text"
                    value="${escapeHtml(
                      Array.isArray(item.extras)
                        ? item.extras.join(", ")
                        : item.extras ?? ""
                    )}"
                >
            </div>

            <button
                class="button button-danger remove-item-button"
                type="button"
                style="margin-top: 10px;"
            >
                Αφαίρεση προϊόντος
            </button>
        `;

        wrapper
          .querySelector(".remove-item-button")
          .addEventListener("click", () => {
            wrapper.remove();

            if (elements.itemsEditor.children.length === 0) {
              addEditableItem();
            }
          });

        elements.itemsEditor.appendChild(wrapper);
      }

      function collectEditedItems() {
        const itemElements =
          elements.itemsEditor.querySelectorAll(".editable-item");

        return Array.from(itemElements)
          .map((itemElement) => {
            const product = itemElement
              .querySelector(".edit-item-product")
              .value.trim();

            const quantity = Number(
              itemElement.querySelector(".edit-item-qty").value,
            );

            const optionsText = itemElement
              .querySelector(".edit-item-options")
              .value.trim();

            const extrasText = itemElement
              .querySelector(".edit-item-extras-input")
              .value.trim();

            const options = optionsText
              ? optionsText
                  .split(",")
                  .map((value) => value.trim())
                  .filter(Boolean)
              : [];

            const extras = extrasText
              ? extrasText
                  .split(",")
                  .map((value) => value.trim())
                  .filter(Boolean)
              : [];

            return {
              product,
              qty: Math.max(quantity || 1, 1),
              options,
              extras,
            };
          })
          .filter((item) => item.product);
      }

      async function updateOrder(event) {
        event.preventDefault();

        const orderId = elements.editOrderId.value;

        const items = collectEditedItems();

        if (items.length === 0) {
          showToast(
            "Η παραγγελία πρέπει να περιέχει τουλάχιστον ένα προϊόν.",
            "error",
          );

          return;
        }

        const payload = {
          items,
          order_type: elements.editOrderType.value,
          address: elements.editAddress.value.trim(),
          phone: elements.editPhone.value.trim(),
        };

        try {
          const response = await fetch(`/api/orders/${orderId}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });

          const data = await safeReadJson(response);

          if (!response.ok) {
            throw new Error(data.detail ?? "Αποτυχία επεξεργασίας.");
          }

          closeEditModal();

          showToast("Η παραγγελία ενημερώθηκε.", "success");

          await fetchOrders();
        } catch (error) {
          showToast(error.message, "error");
        }
      }

      async function safeReadJson(response) {
        try {
          return await response.json();
        } catch (error) {
          return {};
        }
      }

      function configureAutoRefresh() {
        if (state.refreshIntervalId) {
          window.clearInterval(state.refreshIntervalId);

          state.refreshIntervalId = null;
        }

        if (elements.autoRefresh.checked) {
          state.refreshIntervalId = window.setInterval(() => {
            fetchOrders();
            checkHealth();
          }, state.refreshEveryMilliseconds);
        }
      }

      elements.refreshButton.addEventListener("click", () =>
        fetchOrders({
          showLoading: true,
        }),
      );

      elements.storeFilter.addEventListener("change", () =>
        fetchOrders({
          showLoading: true,
        }),
      );

      elements.statusFilter.addEventListener("change", renderOrders);

      elements.searchInput.addEventListener("input", renderOrders);

      elements.autoRefresh.addEventListener("change", configureAutoRefresh);

      elements.editOrderForm.addEventListener("submit", updateOrder);

      elements.addItemButton.addEventListener("click", () => addEditableItem());

      elements.closeModalButton.addEventListener("click", closeEditModal);

      document.querySelectorAll("[data-close-modal]").forEach((button) => {
        button.addEventListener("click", closeEditModal);
      });

      elements.editModal.addEventListener("click", (event) => {
        if (event.target === elements.editModal) {
          closeEditModal();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (
          event.key === "Escape" &&
          elements.editModal.classList.contains("visible")
        ) {
          closeEditModal();
        }
      });

      async function initializeDashboard() {
        await checkHealth();

        await fetchOrders({
          showLoading: true,
        });

        configureAutoRefresh();
      }

      initializeDashboard();
    </script>
  </body>
</html>
